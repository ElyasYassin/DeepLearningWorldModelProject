base_config: ../experiments/server_ppo_resnet18_lstm_ft.yaml

optuna:
  baseline_key: ppo_resnet18_lstm_ft
  train_module: baselines.ppo_resnet18_lstm_ft_baseline
  artifact_prefix: optuna_server_ppo_resnet18_lstm_ft
  study_name: optuna_server_ppo_resnet18_lstm_ft_baseline_img224
  storage: sqlite:///optuna_studies/optuna_server_ppo_resnet18_lstm_ft_baseline_img224.db
  n_trials: 12
  eval_episodes: 10
  train_timesteps: 500_000

  search_space:
    learning_rate: [1.0e-5, 1.0e-4, 1.0e-3]
    n_steps: [512]
    lstm_hidden_size: [128, 256]
    unfreeze_layers:
      layer4: ["layer4"]
      layer3_layer4: ["layer3", "layer4"]
