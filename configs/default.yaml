# Shared default configuration.
# Experiment-specific baseline settings live in configs/experiments/ and configs/tuning/.

env:
  engine: mujoco          # mujoco only
  image_size: 64          # Height and width of RGB observations (pixels)
  max_episode_steps: 500
  robot: Panda            # robosuite robot model
  camera_name: robot0_eye_in_hand  # wrist-mounted camera on the Panda end-effector

encoder:
  latent_dim: 128
  learning_rate: 1.0e-4
  batch_size: 32
  epochs: 50

dynamics:
  d_model: 256
  nhead: 4
  num_layers: 4
  max_seq_len: 64
  learning_rate: 1.0e-4
  batch_size: 32
  epochs: 50

controller:
  hidden_dim: 256
  learning_rate: 3.0e-4
  gamma: 0.99
  imagination_horizon: 15   # Steps to roll out in latent space per update

evaluation:
  n_eval_episodes: 20
  log_dir: logs/

dreamer:
  # Encoder
  encoder_type: resnet      # resnet | cnn
  pretrained_encoder: true  # use ImageNet pretrained weights
  freeze_encoder: false     # fine-tune backbone during world-model training
  depth: 48                 # only used when encoder_type: cnn
  embed_dim: 512            # encoder output dimension

  # RSSM
  dynamics_type: gru          # transformer | gru
  d_model: 512                # Transformer model dimension (transformer only)
  nhead: 8                    # attention heads (transformer only)
  num_layers: 4               # Transformer encoder layers (transformer only)
  max_ctx_len: 64             # maximum context window length
  h_dim: 512          # deterministic state size (h_dim = d_model output projection)
  stoch_size: 32      # number of categorical variables
  stoch_classes: 32   # classes per categorical variable → stoch_flat = 1024
  # feat_dim = h_dim + stoch_flat = 1536

  # Decoder / predictor MLP width
  hidden_dim: 512

  # World model loss weights
  kl_scale: 0.1       # multiplier on KL loss term
  free_bits: 1.0      # minimum KL per categorical variable (nats)
  kl_balance: 0.8     # fraction of KL gradient through posterior

  # Actor-critic
  imagination_horizon: 15
  gamma: 0.99
  lam: 0.95
  entropy_coef: 3.0e-4

  # Optimizers
  wm_lr: 1.0e-4
  actor_lr: 3.0e-5
  critic_lr: 3.0e-4

  # Training loop
  max_env_steps: 1000000
  batch_size: 16
  seq_len: 64
  grad_steps_per_episode: 50
  prefill_episodes: 50
  explore_steps: 10000
  replay_capacity: 500000
