base_config: ../experiments/ppo_resnet18_lstm_ft.yaml

optuna:
  study_name: resnet18_lstm_ft
  storage: sqlite:///optuna_studies/resnet18_lstm_ft.db
  n_trials: 5
  direction: maximize
  objective_metric: mean_reward
  eval_episodes: 5
  train_timesteps: 1_000_000

  search_space:
    learning_rate: [5.0e-5, 1.0e-4, 2.0e-4]
    n_steps: [512, 1024, 2048]
    lstm_hidden_size: [64, 128, 256]
    unfreeze_layers:
      layer4: ["layer4"]
      # layer3_layer4: ["layer3", "layer4"]
