base_config: ../experiments/ppo.yaml

optuna:
  baseline_key: ppo
  train_module: baselines.ppo_baseline
  artifact_prefix: optuna_ppo
  study_name: ppo_baseline
  storage: sqlite:///optuna_studies/ppo_baseline.db
  n_trials: 6
  direction: maximize
  objective_metric: mean_reward
  eval_episodes: 5
  train_timesteps: 500_000

  search_space:
    learning_rate: [5.0e-5, 1.0e-4, 3.0e-4]
    n_steps: [512, 1024]
