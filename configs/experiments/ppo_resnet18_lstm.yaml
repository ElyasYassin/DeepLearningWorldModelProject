base_config: ../default.yaml

baselines:
  ppo_resnet18_lstm:
    learning_rate: 3.0e-4
    n_envs: 8
    n_steps: 1024
    batch_size: 512
    n_epochs: 5
    gamma: 0.99
    total_timesteps: 1_000_000
    visual_dim: 128
    freeze_backbone: true
    lstm_hidden_size: 256
    n_lstm_layers: 1
    policy_hidden_sizes: [128]
    value_hidden_sizes: [128]
    device: cuda
    tb_log_name: resnet18_lstm_ppo
    save_path: trained_models/ppo_resnet18_lstm_target_tracking
