base_config: ../default.yaml

baselines:
  ppo_resnet18_ft:
    learning_rate: 1.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    total_timesteps: 1_000_000
    visual_dim: 128
    unfreeze_layers: ["layer3", "layer4"]
    policy_hidden_sizes: [256, 256]
    value_hidden_sizes: [256, 256]
    tb_log_name: resnet18_ppo_ft_l3_l4
    save_path: trained_models/ppo_resnet18_target_tracking_ft_l3_l4
